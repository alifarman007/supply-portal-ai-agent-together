# =============================================================================
# TDS (income tax deducted at source) - FY2026-27
#
# STATUS: DRAFT. Every rate below was read from the official gazette PDF in
# nbr_documents/ on 2026-08-26 and each was independently re-read by a second
# reader, but NONE has been confirmed by an accountant. `show-policy` still
# prints the unverified warning and Phase 5 is not complete until sign-off.
#
# SOURCE: Utse Kor Bidhimala 2026 (Withholding Tax Rules 2026),
# S.R.O. 273-Ain/Aykar-5/2026, gazetted 5 July 2026, deemed in force 1 July 2026.
# NOT S.R.O. 210 of 8 June 2026 - that earlier SRO of the SAME NAME was
# superseded before taking effect and differs on SERVICE rates.
#
# STRUCTURE: Rule 3(1) is keyed to COMMODITY / ACTIVITY TYPE across 20 serials,
# NOT to amount slabs. Its chapeau applies the rates to base value of ANY amount
# ("je-kono poriman bhittimulyer upor") - there is NO de-minimis floor. Each
# entry below therefore has ONE open slab.
#
# BASE DEFINITION: `base: excl_vat` is CONFIRMED BY COMPANY PRACTICE.
# The company's own withholding working
# (application_example/Application of withholding tax and VAt-19.10.2021.xls,
# Kazi Farms Group) computes the deduction on the VAT-EXCLUSIVE purchase price:
# invoice 5,750,000 less VAT 750,000 = 5,000,000, withholding 3% x 5,000,000 =
# 150,000, payable 5,600,000. Reproduced by
# tests/golden/test_company_worked_example.py, which also fails if anyone flips
# the base (incl_vat would deduct 172,500 - a 15% overstatement).
#
# ⚠️ Residual caveat, worth one question to the accountant: that workbook is
# FY2021-22 under the OLD Income Tax Ordinance 1984 (it cites ss. 52/52AA/52U).
# Under the CURRENT Income Tax Act 2023, s.140(5) defines base value as the
# highest of contract value, bill/invoice amount and payment, and is SILENT on
# VAT - a sweep of all 287 pages found no withholding-base VAT rule, while
# s.152(3) shows the drafter did write "minus VAT and SD" where intended. So
# the ex-VAT treatment rests on continuous practice, not on the words of the
# current Act. Confirm the practice carried over to the 2023 Act.
#
# NOT YET MODELLED (needs engine work, not just data):
#   - Rule 3(1) proviso: NO deduction at all on oil/gas supplied by a petrol
#     pump or CNG station.
#   - Rule 3(2)/(3): the section 89 deduction is NET OF import-stage tax paid
#     under s.120, and of tax paid under s.94, via a (B - A) formula.
#   - s.142(2): a separate uplift where payment is not made by bank transfer.
# =============================================================================

