# =============================================================================
# SERVICES - Rule 4(1) under Income Tax Act 2023 s.90
#
# Three differences from the goods table above, each of which changes money:
#
# 1. Rule 4 does NOT charge on "base value" (bhittimulyo). Rule 3 does, and the
#    term is defined by ITA s.140(5); Rule 4 names its own base per row -
#    "on the commission", "on the total bill", "on the gross bill", or simply
#    the named fee. `base: excl_vat` below records OUR treatment (consistent
#    with the goods table and the company working paper), not a statutory
#    instruction.
# 2. Serials 1-3 are rated differently for a NATURAL PERSON than for a company
#    -> `rate_natural_person`, driven by supplier.is_natural_person.
# 3. Serials 4, 12, 13 and 18 charge the GREATER of a rate on the commission
#    and a rate on the total bill, where BOTH are disclosed (proviso (kha)).
#    A bill line carries no commission split, so the engine computes the
#    total-bill figure and raises `tds_higher_of_commission_unresolved`
#    (REVIEW) rather than silently taking the lower number.
#
# NOT MODELLED: proviso (ka) - no deduction on a serial-19 service rendered by
# a bank, insurer, financial institution or MFS provider. Serial 19 also
# requires the service not be deductible under ANY other section, which is a
# judgement call rather than a lookup.
# =============================================================================

