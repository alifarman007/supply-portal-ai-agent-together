# VDS SERVICE CODES - Rule 3(1) table, VAT Deduction at Source Rules 2025
# (S.R.O. 182-Ain/2025/310-Mushak) as amended for FY2026-27 by
# S.R.O. 140-Ain/2026/345-Mushak.
#
# STATUS: DRAFT, read 2026-08-27 by two independent readers (one top-down, one
# bottom-up at high DPI) and reconciled by a third. NOT signed off.
#
# GROUND TRUTH CHECK PASSED: a real supplier invoice supplied by the owner
# shows S001.10 = 15% and S001.20 = 5%. Both match. That anchors 2 of 51 rows;
# the other 49 rest on the gazette alone.
#
# WHY THIS TABLE EXISTS AND WHY IT MATTERS:
# Rule 3(1)'s opening words require deduction at the tabled rate
# "musok chalanpotro thakuk ba na thakuk abosshikbhabe" - MANDATORILY, WHETHER
# OR NOT A MUSHAK 6.3 EXISTS. That is the opposite of the goods rule. Without
# this table a service bill with a valid VAT invoice was deducted NOTHING, i.e.
# under-deducted, which is our liability with a 2%/month charge.
#
# 🔴 A CODE DOES NOT ALWAYS DETERMINE A RATE. Four codes carry sub-rows:
#   S001.10  AC hotel 15% vs non-AC hotel 10%   (5 point swing)
#   S010.20  building construction 2% / 4.5% / 2% by floor area
#   S048.00  transport contractor 5% petroleum vs 15% other goods (3x swing)
#   S024.00  two sub-rows, both 7.5% - resolves to one rate in practice
# Where the rate is genuinely ambiguous the engine computes NOTHING and raises
# a REVIEW naming the candidates. It must never pick one silently.
#
# ⚠️ THIS TABLE IS NOT THE WHOLE OF RULE 3, AND NOT THE WHOLE ANSWER:
#   - RULE 5 can switch a row off entirely (attested Mushak 6.3 for S007.00 and
#     S043.00, First Schedule items, zero-rated supplies, EFD-issued invoices,
#     registered startups, and more). This engine does NOT evaluate Rule 5, so
#     an applied rate is disclosed as such and may OVER-deduct.
#   - SUB-RULES 3(2)-(5) carry 15% obligations that are NOT rows in this table:
#     premises rent, imported services, licence/permit fees and revenue-sharing.
#     A bill for those finds no code here and will be UNDER-deducted.
#   - THE BASE (VAT-inclusive or exclusive) IS NOT FIXED BY THIS TABLE.
#   - There is deliberately NO S099.40; the gazette skips it.
# =============================================================================


